async function persist(){if(!app.ready)throw Error('この環境では保存不可');await dbPut(app.db,'snap','main',app.state)}
async function oldImport(){let old;try{old=await openDb(OLDDB,1);if(!old.objectStoreNames.contains('items'))return 0;let list=await dbAll(old,'items');app.state.singles=list.filter(x=>x&&TYPES[x.type]).map(x=>({id:String(x.id||id()),type:x.type,title:String(x.title||''),work:String(x.work||''),character:String(x.character||''),category:String(x.category||''),series:String(x.series||''),photo:String(x.photo||''),code:String(x.code||''),memo:String(x.memo||''),owned:n(x.owned),trade:Math.min(n(x.trade),n(x.owned)),wanted:!!x.wanted,createdAt:x.createdAt||today(),updatedAt:x.updatedAt||today()}));return app.state.singles.length}catch(e){console.info('旧データ取り込みなし',e);return 0}finally{old?.close()}}
function allSeries(){return app.state.series||[]}function allSingles(){return app.state.singles||[]}
function variants(){return allSeries().flatMap(s=>s.variants.map(v=>({...v,type:s.type,seriesId:s.id,seriesName:s.title,work:s.work,category:s.category,price:s.price,seriesPhoto:s.photo}))) }
function numsFor(t){return variants().filter(v=>v.type===t).reduce((a,v)=>a+n(v.owned),0)+allSingles().filter(v=>v.type===t).reduce((a,v)=>a+n(v.owned),0)}

function missingPriceCount(v){const lots=v.lots||[];const counted=lots.reduce((a,l)=>a+n(l.qty),0);return lots.filter(l=>l.amount==null).reduce((a,l)=>a+n(l.qty),0)+Math.max(0,n(v.owned)-counted)}
function spent(){let normal=0,mercari=0,unknown=0;for(const series of allSeries()){if(series.type==='cards')continue;for(const v of series.variants||[]){unknown+=missingPriceCount(v);for(const lot of v.lots||[]){if(lot.amount==null)continue;if(lot.mercari)mercari+=Number(lot.amount)||0;else normal+=Number(lot.amount)||0;}}}const cards=cardFaceValue();return {normal,mercari,unknown,cardTotal:cards.total,total:normal+mercari+cards.total}}
// 所持カードの額面換算。購入履歴とは独立し、所持枚数の変更で即時再計算する。
function cardFaceValue(){let normal=0,planet=0;for(const c of allSingles()){if(c.type!=='cards')continue;const qty=n(c.owned);if(cardSeriesKey(c.cardSeries||c.series||c.work)==='プラネット！')planet+=qty;else normal+=qty;}for(const s of allSeries()){if(s.type!=='cards')continue;const qty=(s.variants||[]).reduce((sum,v)=>sum+n(v.owned),0);if(cardSeriesKey(s.cardSeries||s.work)==='プラネット！')planet+=qty;else normal+=qty;}return {normal,planet,total:normal*100+planet*200};}

function cardSortValue(){return app.cardSort||'code-asc'}
function cardRank(c){
  const series=cardSeriesKey(c.cardSeries||c.series||c.work);
  const rank=cardRarities(series).indexOf(c.rarity||'');
  return rank<0?-1:rank;
}
function sortedCardList(items){
 const k=cardSortValue(),collator=new Intl.Collator('ja-JP',{numeric:true,sensitivity:'base'});
 return items.sort((a,b)=>{
   let v=0;
   if(k.startsWith('code')){if(!a.code||!b.code){if(!a.code&&!b.code)return collator.compare(a.title||'',b.title||'');return !a.code?1:-1;}v=collator.compare(a.code,b.code);}
   else if(k.startsWith('rarity')){if(cardRank(a)<0||cardRank(b)<0){if(cardRank(a)<0&&cardRank(b)<0)return collator.compare(a.title||'',b.title||'');return cardRank(a)<0?1:-1;}v=cardRank(a)-cardRank(b);}
   else if(k==='name')v=collator.compare(a.title||'',b.title||'');
   else if(k==='latest')v=collator.compare(b.updatedAt||b.createdAt||'',a.updatedAt||a.createdAt||'');
   if(k==='code-desc'||k==='rarity-desc')v=-v;
   return v||collator.compare(a.code||a.title||'',b.code||b.title||'');
 });
}

function catalogFilterState(type){app.catalogFilters??={};return app.catalogFilters[type]??={}}

 const q=app.query.toLocaleLowerCase('ja-JP').trim();

 let singles=single.filter(x=>(!f.work||x.work===f.work)&&(!f.category||x.category===f.category)&&showVariant(x)).filter(x=>!q||[x.title,x.work,x.character,x.category,x.series,x.code].join(' ').toLocaleLowerCase('ja-JP').includes(q));
 const options=(values,chosen,allLabel)=>`<option value="">${allLabel}</option>${values.map(v=>`<option value="${esc(v)}" ${v===chosen?'selected':''}>${esc(v)}</option>`).join('')}`;

 ${!list.length&&!singles.length?'<div class="empty">条件に一致するアイテムはありません。<br>条件を変えて探してね。</div>':''}`;

function listPage(type){if(type==='cards')return cardGalleryPage();if(type==='goods'||type==='gacha')return catalogPage(type);let title=type==='cards'?'アイカツカード':type==='gacha'?'ガチャ':'アニメグッズ';let desc=type==='cards'?'初代・オンパレード・アンコールから選んで弾数ごとに整理。公式カードリストの自動取り込みは今後対応予定。':type==='gacha'?'ガチャの全ラインナップを商品ごとに管理':'缶バッジ・アクスタ・紙類など、作品別にまとめて管理';const q=app.query.toLowerCase();let list=allSeries().filter(s=>s.type===type).filter(s=>[s.title,s.work,s.category,s.maker,...s.variants.flatMap(v=>[v.name,v.character])].join(' ').toLowerCase().includes(q));let singles=allSingles().filter(s=>s.type===type).filter(s=>[s.title,s.work,s.character,s.category,s.brand,s.cardRound,s.code].join(' ').toLowerCase().includes(q));if(type==='cards'&&app.tab!=='all'){list=list.filter(s=>cardSeriesKey(s.cardSeries)===app.tab);singles=singles.filter(s=>cardSeriesKey(s.cardSeries||s.series)===app.tab)}if(type==='cards'&&app.cardRoundFilter){list=list.filter(x=>String(x.cardRound||'')===app.cardRoundFilter);singles=singles.filter(x=>String(x.cardRound||'')===app.cardRoundFilter)}let tabs=type==='cards'?`${cardFaceValuePanel()}
 <div class="segmented">${['all','初代アイカツ！','スターズ！','フレンズ！','オンパレード','アンコール','プラネット！'].map(t=>`<button data-tab="${esc(t)}" class="${app.tab===t?'sel':''}">${t==='all'?'すべて':cardLabel(t)}</button>`).join('')}</div>`:'';
return `${intro('MY TREASURES',title,desc)}${tabs}${type==='cards'?`<div class="card-filter"><label class="label">弾数で絞り込む</label><select class="field" id="card-round-filter"><option value="">すべての弾数</option>${(app.tab==='all'?[...new Set(CARD_SERIES.flatMap(([k])=>cardRounds(k)))]:cardRounds(app.tab)).map(r=>`<option value="${esc(r)}" ${app.cardRoundFilter===r?'selected':''}>${esc(r)}</option>`).join('')}</select></div>`:''}<div class="search">⌕ <input id="query" placeholder="商品・作品・キャラ名で検索" value="${esc(app.query)}"></div><div class="btnline" style="margin-top:12px"><button class="primary" data-add="${type}">＋ ${type==='cards'?'カード':'商品シリーズ'}を登録</button></div><div class="muted" style="margin-top:12px">商品シリーズ ${list.length}件 ・ 個別登録 ${singles.length}件</div><div class="itemgrid" id="listing">${list.map(s=>seriesTile(s)).join('')}${singles.map(x=>singleTile(x)).join('')}</div>${!list.length&&!singles.length?`<div class="empty"><div class="big">${EMO[type]}</div>まだアイテムがありません。<br>上の「＋」から登録してね。</div>`:''}`}
function seriesTile(s){let qty=s.variants.reduce((a,v)=>a+n(v.owned),0),tr=s.variants.reduce((a,v)=>a+n(v.trade),0);return `<article class="tile"><div class="cover">${photoMarkup(s.photo,EMO[s.type])}</div><div class="tile-body"><h3>${esc(s.title)}</h3><small>${esc(s.work)}・${s.variants.length}種類</small><div><span class="pill">所持 ${qty}</span> <span class="pill lav">交換 ${tr}</span></div><button data-view="${esc(s.id)}">ラインナップを見る ›</button></div></article>`}

a-listback="${s.type}">← ${TYPES[s.type]}へ戻る</button><div class="note">所持数の「＋1 / −1」は個数だけの調整で、支出には加算されません。購入分として記録する際は「＋購入」を使ってね。</div>`}
function unpriced(){const rows=[];for(const s of allSeries())for(const v of s.variants){const missing=missingPriceCount(v);if(missing>0)rows.push({s,v,missing})}return `${intro('UNPRICED ITEMS','価格未記録のグッズ','金額を後からまとめて登録できる一覧。購入金額の記録を開いて入力してね。')}<div class="panel"><div class="row"><b>未記録 ${rows.reduce((a,r)=>a+r.missing,0)}個・${rows.length}種類</b><button class="outline mini" data-page="finance">← 家計簿へ</button></div></div><div class="panel">${rows.length?rows.map(({s,v,missing})=>`<div class="group-item"><div class="row">${thumb(v.photo||s.photo,EMO[s.type])}<div class="grow"><b>${esc(v.name)}</b><small style="display:block;color:var(--sub)">${esc(s.title)} ・ ${esc(s.work)}</small><span class="pill">未記録 ${missing}個</span></div></div><button class="soft wide" style="margin-top:8px" data-ledger="${esc(s.id)}:${esc(v.id)}">¥ 金額を登録・編集</button></div>`).join(''):'<p class="help">価格未記録のグッズはないよ。</p>'}</div>`}
function finance(){const total=spent(),cards=cardFaceValue(),byType={cards:cards.total,goods:0,gacha:0};for(const series of allSeries()){if(series.type==='cards')continue;const amt=(series.variants||[]).flatMap(v=>v.lots||[]).reduce((a,l)=>a+(l.amount==null?0:Number(l.amount)||0),0);byType[series.type]=(byType[series.type]||0)+amt}return `${intro('MY COLLECTION BUDGET','コレクション家計簿','カードは所持枚数×定価、グッズ・ガチャは登録済みの定価または二次流通購入価格で集計。')}<div class="panel" style="background:linear-gradient(120deg,#ffe6f2,#eadfff)"><div class="eyebrow">コレクション合計（カードは定価換算）</div><div style="font-size:32px;font-weight:900;color:#cc548e">${yen(total.total)}</div><div class="muted">カード ${yen(cards.total)} ＋ グッズ・ガチャ定価 ${yen(total.normal)} ＋ 二次流通 ${yen(total.mercari)}</div></div><div class="stats">${['cards','goods','gacha'].map(t=>`<div class="stat"><small>${EMO[t]} ${TYPES[t]}</small><strong style="font-size:19px">${yen(byType[t]||0)}</strong></div>`).join('')}<button class="stat" data-page="unpriced" style="text-align:left;cursor:pointer;border:1px solid var(--line);font:inherit;color:inherit"><small>価格未記録の数量　↗</small><strong>${total.unknown}</strong></button></div><div class="note">カード：通常 ${cards.normal}枚×100円=${yen(cards.normal*100)} ／ プラネット ${cards.planet}枚×200円=${yen(cards.planet*200)}。カードは現在の所持枚数による定価換算額で、実際の支払額ではありません。グッズ・ガチャの購入記録は交換・処分後も残ります。</div>${heading('商品シリーズ別の記録')}<div class="panel">${allSeries().filter(s=>s.type!=='cards').length?allSeries().filter(s=>s.type!=='cards').map(s=>{let amount=(s.variants||[]).flatMap(v=>v.lots||[]).reduce((a,l)=>a+(l.amount==null?0:+l.amount||0),0);return `<div class="row group-item"><div class="grow"><b>${esc(s.title)}</b><small style="display:block;color:var(--sub)">${esc(s.work)}</small></div><b>${yen(amount)}</b></div>`}).join(''):'まだ購入金額の記録がありません'}</div>`}
function guessCharacters(work){let w=canonical(work);if(w.startsWith('アイカツ'))return CHARS['アイカツ！'];return CHARS[w]||[]}
function suggestions(key,work=''){
 if(key==='category'){
  const type=app.editor?.type||'goods',scoped=type==='gacha'?'gachaCategory':'goodsCategory';
  const own=app.state.vocab?.categoryByType?.[type]||[];
  const existing=allSeries().filter(s=>s.type===type).map(s=>s.category);
  const fromSingles=allSingles().filter(x=>x.type===type).map(x=>x.category);
  return [...new Set([...own,...existing,...fromSingles,...CATS].map(canonical).filter(Boolean))].filter(x=>isShown(scoped,x,type));
 }
 const preset=key==='work'?WORKS:key==='character'?guessCharacters(work):[];
 const own=app.state.vocab?.[key]||[];
 const existing=allSeries().flatMap(s=>key==='character'?s.variants.map(v=>v.character):[s[key]||'']);
 return [...new Set([...own,...existing,...preset].map(canonical).filter(Boolean))].filter(x=>isShown(key,x));
}
function characterCandidates(work,query=''){
 const w=canonical(work),mapped=app.state.vocab?.characterByWork||{};
 // Existing records are used as candidates, even when created before v2.3.
 const fromRecords=allSeries().filter(s=>canonical(s.work)===w).flatMap(s=>s.variants.map(v=>v.character));
 const fromSingles=allSingles().filter(s=>canonical(s.work)===w).map(s=>s.character);
 const all=[...(mapped[w]||[]),...fromRecords,...fromSingles,...guessCharacters(w)];
 const unique=[...new Set(all.map(v=>String(v||'').trim()).filter(Boolean))];
 const q=String(query||'').trim().toLocaleLowerCase('ja-JP');
 return (q?unique.filter(v=>v.toLocaleLowerCase('ja-JP').includes(q)):unique).filter(x=>isShown('character',x,w)).slice(0,8);
}
function refreshCharacterChoices(field){
 if(!app.editor||!field)return;
 let v=variantById(field.dataset.vid),row=field.closest('.lineup-row'),box=row?.querySelector('[data-char-choices]');
 if(!v||!box)return;
 const choices=characterCandidates(app.editor.work,field.value);
 box.hidden=false;
 box.innerHTML=`<span class="helper">${esc(app.editor.work||'選択した作品')}のキャラクター候補</span>`+
  `<div class="suggest-results">${choices.length?choices.map(x=>`<button type="button" data-char-pick="${esc(x)}" data-char-id="${esc(v.id)}">${esc(x)}</button>`).join(''):'<span class="helper">候補なし。そのまま新しい名前を入力して保存できるよ。</span>'}</div>`;
}
function quantityOptions(value,max=30,min=0){
 const val=n(value),last=Math.max(min,Math.min(30,max));let html='';
 for(let i=min;i<=last;i++)html+=`<option value="${i}" ${i===val?'selected':''}>${i}</option>`;
 if(val>last)html+=`<option value="${val}" selected>${val}</option>`;
 html+='<option value="custom">✎ 数字を入力…</option>';
 return html;
}
function quantityControl(value,key,variantId,max=999){
 return `<span class="qty-picker"><select aria-label="${key==='owned'?'所持数':'交換可能数'}" class="qty-select" data-vqty="${key}" data-vid="${esc(variantId)}">${quantityOptions(value,max)}</select><span class="unit">個</span></span>`;

function askQuantity(label,current,min=0,max=99999){
 const raw=window.prompt(`${label}を数字で入力してね`,String(current));
 if(raw===null)return null;
 if(!/^\d+$/.test(raw.trim())||Number(raw)>max||Number(raw)<min){toast(`個数は${min}〜${max}の数字で入力してね`);return null}
 return Number(raw);
}
function rememberVocabulary(series){
 app.state.vocab??={work:[],category:[],brand:[],character:[],characterByWork:{}};
 const add=(key,value)=>{value=canonical(value);if(!value)return;let arr=app.state.vocab[key]||[];app.state.vocab[key]=[value,...arr.filter(x=>x!==value)].slice(0,500)};
 add('work',series.work);add('category',series.category);
 app.state.vocab.categoryByType??={};let prev=app.state.vocab.categoryByType[series.type]||[];
 app.state.vocab.categoryByType[series.type]=[series.category,...prev.filter(x=>x!==series.category)].filter(Boolean).slice(0,500);
 const work=canonical(series.work);app.state.vocab.characterByWork??={};
 let used=app.state.vocab.characterByWork[work]||[];
 for(let v of series.variants){add('character',v.character);if(v.character){let name=v.character.trim();used=[name,...used.filter(x=>x!==name)]}}
 app.state.vocab.characterByWork[work]=used.slice(0,500);
}
function choices(key,filter=''){
 let all=suggestions(key),q=String(filter||'').trim().toLocaleLowerCase('ja-JP');
 const hits=q?all.filter(x=>x.toLocaleLowerCase('ja-JP').includes(q)):all;
 const limit=q?12:6;
 return `<div class="suggest-caption">${q?'検索に一致する候補':'最近使った候補・よく使う項目'}${hits.length>limit?'（さらに絞り込み可能）':''}</div><div class="suggest-results" data-suggest-list="${key}">${hits.slice(0,limit).map(x=>`<button type="button" data-select="${key}" data-value="${esc(x)}">${esc(x)}</button>`).join('')||'<span class="help">一致する候補なし。新しい名前として保存できるよ。</span>'}</div>`;
}
function refreshChoices(key,filter){let el=$(`[data-choice-box="${key}"]`);if(el)el.innerHTML=choices(key,filter)}

const CARD_CATALOG_KEY='twinkle_catalog_import_v1';
function importedCardSeeds(){try{let x=JSON.parse(localStorage.getItem(CARD_CATALOG_KEY)||'[]');return Array.isArray(x)?x:[]}catch{return []}}
function allCardSeeds(){const map=new Map();for(const x of [...OFFICIAL_CARD_SEEDS,...importedCardSeeds()])if(x.series&&x.code)map.set(x.series+'|'+x.code,x);return [...map.values()]}
function parseCardCsv(text){let rows=[],row=[],field='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);row=[];field=''}else field+=c}if(quoted)throw Error('CSVの引用符が閉じていません');row.push(field);if(row.some(x=>x.trim()))rows.push(row);return rows}
function importCardCatalog(text){const t=text.trim();if(!t)throw Error('データが空です');let items;if(t.startsWith('[')){items=JSON.parse(t);if(!Array.isArray(items))throw Error('JSON配列が必要です')}else{let rows=parseCardCsv(t),header=(rows.shift()||[]).map(x=>x.trim().replace(/^\uFEFF/,''));if(['series','code','title'].some(x=>!header.includes(x)))throw Error('series,code,title の列が必要です');items=rows.map(row=>Object.fromEntries(header.map((h,i)=>[h,(row[i]||'').trim()])))}if(items.length>10000)throw Error('1回の上限は10000件です');let map=new Map(importedCardSeeds().map(x=>[x.series+'|'+x.code,x]));let added=0,updated=0,skipped=0;const valid=['初代アイカツ！','スターズ！','フレンズ！','オンパレード','アンコール','プラネット！'];for(let x of items){let series=String(x.series||'').trim(),code=String(x.code||'').trim(),title=String(x.title||'').trim();if(!valid.includes(series)||!code||!title||code.length>80||title.length>160){skipped++;continue}let key=series+'|'+code;let item={series,code,title,rarity:String(x.rarity||'').slice(0,80),cardType:String(x.cardType||'').slice(0,80),cardCategory:String(x.cardCategory||'').slice(0,80),brand:String(x.brand||'').slice(0,100),round:String(x.round||'').slice(0,80),url:safeSourceLink(String(x.url||''))?String(x.url):''};if(map.has(key)||OFFICIAL_CARD_SEEDS.some(y=>y.series===series&&y.code===code))updated++;else added++;map.set(key,item)}localStorage.setItem(CARD_CATALOG_KEY,JSON.stringify([...map.values()]));return {added,updated,skipped,total:allCardSeeds().length}}
function cardCatalogImportDialog(){$('#overlay').innerHTML=modal('カード図鑑の一括取り込み',`<div class="note">自分で作成した、または利用許諾のあるカード表をCSV・JSONでまとめて登録できます。所持枚数や購入履歴は変更しません。</div><label class="label">CSV・JSONを貼り付け</label><textarea id="catalog-import-text" class="field" rows="7" placeholder="series,code,title,rarity,cardType,cardCategory,brand,round,url&#10;初代アイカツ！,01-01,オーロラキスキャミソール,プレミアムレア,キュート,トップス,エンジェリーシュガー,第1弾,"></textarea><p class="help">必須列：series,code,title。1回最大10,000件。シリーズ名＋カード番号で重複を統合します。</p><button class="primary wide" data-action="catalog-import-save">まとめて取り込む</button><p class="help">追加図鑑：${importedCardSeeds().length}件／検索候補合計：${allCardSeeds().length}件</p>`)}

async function saveCardEditor(){const c=app.cardDraft;if(!c||!app.ready)return;if(!String(c.title||'').trim()){toast('カード名・スイング名を入力してね');return}const old=allSingles().find(x=>x.id===c.id);const fresh={...c,title:c.title.trim(),cardSeries:cardSeriesKey(c.cardSeries),work:cardLabel(cardSeriesKey(c.cardSeries)),series:cardSeriesKey(c.cardSeries),cardRound:String(c.cardRound||'').trim(),owned:n(c.owned),trade:Math.min(n(c.trade),n(c.owned)),updatedAt:today()};delete fresh.isNew;delete fresh.officialQuery;delete fresh.cardRoundCustom;delete fresh.rarityCustom;if(!fresh.cardRound){toast('弾数を選んでね');return}try{if(old){app.state.singles=allSingles().map(x=>x.id===fresh.id?fresh:x)}else{app.state.singles.push(fresh)}if(fresh.brand){app.state.vocab??={};let oldBrands=app.state.vocab.brand||[];app.state.vocab.brand=[fresh.brand,...oldBrands.filter(x=>x!==fresh.brand)]}app.state.vocab??={};app.state.vocab.roundByScope??={};const arr=app.state.vocab.roundByScope[fresh.cardSeries]||[];app.state.vocab.roundByScope[fresh.cardSeries]=[...new Set([fresh.cardRound,...arr])];app.state.vocab.rarityByScope??={};if(fresh.rarity&&!CARD_RARITIES[fresh.cardSeries].includes(fresh.rarity)){app.state.vocab.rarityByScope[fresh.cardSeries]=[...new Set([fresh.rarity,...(app.state.vocab.rarityByScope[fresh.cardSeries]||[])])]}await persist();app.cardDraft=null;$('#overlay').innerHTML='';app.page='cards';app.tab='all';app.cardRoundFilter='';render();toast('カードを保存したよ ♡')}catch(e){console.error(e);toast('保存できませんでした')}}

function modal(title,body,subtitle=''){return `<div class="overlay"><div class="sheet" role="dialog" aria-modal="true"><div class="sheethead"><div><div class="eyebrow">TWINKLE CLOSET ♡</div><h2>${title}</h2>${subtitle?`<p class="muted">${subtitle}</p>`:''}</div><button class="xbtn" data-action="close" aria-label="閉じる">×</button></div>${body}</div></div>`}

function safeSourceLink(url){try{const u=new URL(String(url||''));return /^https?:$/.test(u.protocol)&&!['localhost','127.0.0.1'].includes(u.hostname)}catch{return false}}
const WORKER_KEY='twinkle_vision_worker_url_v1', TOKEN_KEY='twinkle_vision_access_v1';
function imageSearchConfigured(){try{return !!localStorage.getItem(WORKER_KEY)}catch{return false}}
function imageSearchUrl(){try{return localStorage.getItem(WORKER_KEY)||''}catch{return ''}}
function searchToken(){try{return sessionStorage.getItem(TOKEN_KEY)||''}catch{return ''}}

function imageSearchConfigSave(){const url=$('#photo-worker')?.value.trim()||'',token=$('#photo-token')?.value||'';if(url&&!safeSourceLink(url)){toast('httpsの検索サーバーURLを入力してね');return}if(url)localStorage.setItem(WORKER_KEY,url.replace(/\/$/,''));else localStorage.removeItem(WORKER_KEY);if(token)sessionStorage.setItem(TOKEN_KEY,token);else sessionStorage.removeItem(TOKEN_KEY);renderEditor();toast('接続設定を保存したよ ♡')}
function tinyImageForSearch(data){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,900/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(img,0,0,cv.width,cv.height);let out='';for(const q of [0.78,0.6,0.42,0.25]){out=cv.toDataURL('image/jpeg',q);if(out.length<580000)break}if(out.length>670000)reject(new Error('写真が大きいため検索用に縮小できません'));else resolve(out)};img.onerror=()=>reject(Error('写真を読み込めません'));img.src=data})}
async function imageSearchStart(){const e=app.editor;if(!e?.photo||!e.work.trim()){toast('作品名と写真を先に入れてね');return}if(!imageSearchConfigured()){imageSearchSettings();return}const worker=imageSearchUrl(),token=searchToken();if(!token){imageSearchSettings();toast('検索用の合言葉を入力してね');return}

 try{const image=await tinyImageForSearch(e.photo);const status=$('#photo-search-status');if(status)status.textContent='画像が一致する商品ページと定価の候補を検索しています…';const res=await fetch(worker,{method:'POST',headers:{'Content-Type':'application/json','X-Twinkle-Token':token},body:JSON.stringify({work:e.work,image})});let data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||`検索に失敗しました（HTTP ${res.status}）`);if(!app.editor||app.editor!==e)return;app.photoResults={work:e.work,...data};imageSearchResults()}catch(err){console.error(err);$('#overlay').innerHTML=modal('画像検索の結果',`<div class="note">画像検索を実行できなかったよ：${esc(err.message||'接続エラー')}</div><div class="btnline"><button class="outline" data-action="photo-search-back">入力画面に戻る</button><button class="soft" data-action="photo-settings">接続設定を確認</button></div>`)}
}

// OCRをオンデマンドで読み込む。外部AIの鍵は使わず、Safari内で文字を読み取る。
// Tesseract.jsは初回のみ言語データをダウンロード。画像は商品検索サイトへ送信しない。
let ocrScriptPromise=null,ocrWorker=null;
function ensureOcrScript(){
 if(window.Tesseract?.createWorker)return Promise.resolve();
 if(ocrScriptPromise)return ocrScriptPromise;
 ocrScriptPromise=new Promise((resolve,reject)=>{
  const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';script.async=true;
  script.onload=()=>window.Tesseract?.createWorker?resolve():reject(Error('文字認識ライブラリを読み込めません'));
  script.onerror=()=>reject(Error('文字認識ライブラリの取得に失敗しました。通信を確認してね'));
  document.head.appendChild(script);
 }).catch(err=>{ocrScriptPromise=null;throw err});return ocrScriptPromise;
}
function setOcrStatus(message){let status=$('#ocr-status');if(status)status.textContent=message}
function ocrRawToCandidates(text){
 const reject=/^(?:https?:|www\.|©|ⓒ|copyright|bandai|bnp|監修中|商品画像|対象年齢|全[0-9０-９]+種|※|価格|発売|サンプル|sample|ガシャポン|オンライン|取扱|使用上の注意)/i;
 const seen=new Set();const lines=[];
 for(let part of String(text||'').replace(/\r/g,'\n').split(/\n/)){
  const line=part.replace(/[\t]+/g,' ').replace(/[・•◆★☆✦]+/g,' ').replace(/^[\s\-_,、。:：]+|[\s\-_,、。:：]+$/g,'').trim();
  if(line.length<2||line.length>65||reject.test(line)||/^[0-9\s.]+$/.test(line))continue;
  const normalized=line.toLocaleLowerCase('ja-JP');if(seen.has(normalized))continue;
  seen.add(normalized);lines.push(line);
 }
 return lines;
}
async function startOcr(){

 try{
  await ensureOcrScript();setOcrStatus('日本語・英語の認識データを準備中…（初回は時間がかかるよ）');
  if(!ocrWorker)ocrWorker=await window.Tesseract.createWorker(['jpn','eng'],1,{logger:m=>{if(m.status==='recognizing text')setOcrStatus('画像の文字を読み取っています… '+Math.round((m.progress||0)*100)+'%')}});

function masterCount(key,scope,value){
 const singles=allSingles(),series=allSeries();const byWork=x=>x.work===scope;
 if(key==='work')return series.filter(x=>x.work===value).length+singles.filter(x=>x.work===value).length;
 if(key==='goodsCategory'||key==='gachaCategory')return series.filter(x=>x.type===scope&&x.category===value).length+singles.filter(x=>x.type===scope&&x.category===value).length;
 if(key==='brand')return singles.filter(x=>x.type==='cards'&&x.brand===value).length;
 if(key==='character')return series.filter(byWork).reduce((n,x)=>n+x.variants.filter(v=>v.character===value).length,0)+singles.filter(x=>byWork(x)&&x.character===value).length;
 if(key==='round'||key==='rarity')return singles.filter(x=>x.type==='cards'&&cardSeriesKey(x.cardSeries||x.series)===scope&&x[key==='round'?'cardRound':'rarity']===value).length;
 if(key==='cardType'||key==='cardCategory')return singles.filter(x=>x.type==='cards'&&x[key]===value).length;
 if(key==='cardNumber')return singles.filter(x=>x.type==='cards'&&x.code===value).length;
 if(key==='cardName')return singles.filter(x=>x.type==='cards'&&x.title===value).length;
 if(key==='cardSeries')return singles.filter(x=>x.type==='cards'&&cardLabel(cardSeriesKey(x.cardSeries||x.series))===value).length;
 if(key==='seriesTitle')return series.filter(x=>byWork(x)&&x.title===value).length;
 if(key==='itemName')return series.filter(byWork).reduce((n,x)=>n+x.variants.filter(v=>v.name===value).length,0)+singles.filter(x=>byWork(x)&&x.type!=='cards'&&x.title===value).length;

}

async function masterRename(value){
 const key=masterType(),scope=masterScope(),next=window.prompt(`「${value}」の修正後の名前を入力してね`,value)?.trim();
 if(!next||next===value)return;
 if(key==='cardSeries'){toast('カードシリーズの標準名称は固定だよ。カードごとのシリーズ変更は編集画面から行ってね。');return}
 let count=masterCount(key,scope,value);
 if(!confirm(`「${value}」→「${next}」に修正する？\n登録済み ${count} 件にも反映されるよ。`))return;
 const before=structuredClone(app.state);const singles=allSingles(),series=allSeries();
 const mapName=(obj,field)=>{if(obj[field]===value)obj[field]=next};
 try{
 if(key==='work'){
   series.forEach(x=>mapName(x,'work'));singles.forEach(x=>mapName(x,'work'));
   const by=app.state.vocab?.characterByWork;if(by?.[value]){by[next]=[...new Set([...(by[next]||[]),...by[value]])];delete by[value]}
 }else if(key==='goodsCategory'||key==='gachaCategory'){
   series.filter(x=>x.type===scope).forEach(x=>mapName(x,'category'));singles.filter(x=>x.type===scope).forEach(x=>mapName(x,'category'));
 }else if(key==='character'){
   series.filter(x=>x.work===scope).forEach(x=>x.variants.forEach(v=>mapName(v,'character')));
   singles.filter(x=>x.work===scope).forEach(x=>mapName(x,'character'));
   app.state.vocab??={};app.state.vocab.characterByWork??={};let names=app.state.vocab.characterByWork[scope]||[];
   app.state.vocab.characterByWork[scope]=[next,...names.filter(x=>x!==value&&x!==next)];
 }else if(key==='round'||key==='rarity'){
   singles.filter(x=>x.type==='cards'&&cardSeriesKey(x.cardSeries||x.series)===scope).forEach(x=>mapName(x,key==='round'?'cardRound':'rarity'));
 }else if(key==='brand'||key==='cardType'||key==='cardCategory')singles.filter(x=>x.type==='cards').forEach(x=>mapName(x,key));
 else if(key==='cardNumber')singles.filter(x=>x.type==='cards').forEach(x=>mapName(x,'code'));
 else if(key==='cardName')singles.filter(x=>x.type==='cards').forEach(x=>mapName(x,'title'));
 else if(key==='seriesTitle')series.filter(x=>x.work===scope).forEach(x=>mapName(x,'title'));
 else if(key==='itemName'){
  series.filter(x=>x.work===scope).forEach(x=>x.variants.forEach(v=>mapName(v,'name')));
  singles.filter(x=>x.type!=='cards'&&x.work===scope).forEach(x=>mapName(x,'title'));
 }
 app.state.vocab??={};
 if(key==='round'||key==='rarity'){
  app.state.vocab[`${key}ByScope`]??={};let items=scopedExtras(key,scope);app.state.vocab[`${key}ByScope`][scope]=[next,...items.filter(x=>x!==value&&x!==next)];
 }else if(key==='goodsCategory'||key==='gachaCategory'){
  app.state.vocab.categoryByType??={};app.state.vocab.categoryByType[scope]=[next,...(app.state.vocab.categoryByType[scope]||[]).filter(x=>x!==next&&x!==value)];
 }else if(!['character','seriesTitle','itemName','cardNumber','cardName'].includes(key)){
  app.state.vocab[key]=[next,...(app.state.vocab[key]||[]).filter(x=>x!==next&&x!==value)];
 }
 app.state.vocab.hidden??={};const prop=`${key}::${scope}`,hidden=app.state.vocab.hidden[prop]||[];
 app.state.vocab.hidden[prop]=[value,...hidden.filter(x=>x!==next&&x!==value)];
 await persist();app.masterQuery='';renderMaster();toast('候補と登録データを修正したよ ♡');
 }catch(e){app.state=before;console.error(e);toast('修正を保存できませんでした')}

async function restore(file){try{let obj=JSON.parse(await file.text());let incoming;if(obj.version===2&&Array.isArray(obj.series)&&Array.isArray(obj.singles)){incoming={version:2,series:obj.series,singles:obj.singles,vocab:obj.vocab||{work:[],category:[],brand:[],character:[]}}}else if(obj.version===1&&Array.isArray(obj.items)){incoming={version:2,series:[],singles:obj.items.filter(i=>TYPES[i.type]).map(x=>({...x,id:String(x.id||id())}))}}else throw Error('未対応のファイル');if(!confirm(`バックアップを読み込みますか？\n現在のv2データは上書きされます。\n（復元前のバックアップをおすすめします）`))return;app.state=incoming;await persist();app.page='home';render();toast('バックアップから復元したよ ♡')}catch(e){console.error(e);alert('バックアップファイルを読み込めませんでした。ファイルを確認してね。')}}
async function renameBatch(){let key=$('#rename-field').value,from=$('#rename-old').value.trim(),to=$('#rename-new').value.trim();if(!from||!to||from===to){toast('変更前と変更後の名称を入力してね');return}let count=0;for(const s of allSeries()){if(key==='character'){count+=s.variants.filter(v=>v.character===from).length}else if(s[key]===from)count++}for(const a of allSingles()){if(a[key]===from)count++}if(!count){toast('一致する登録はありません');return}if(!confirm(`${count}件の「${from}」を「${to}」に変更しますか？`))return;for(const s of allSeries()){if(key==='character'){for(const v of s.variants)if(v.character===from)v.character=to}else if(s[key]===from)s[key]=to}for(const a of allSingles()){if(a[key]===from)a[key]=to}if(app.state.vocab?.[key]){let list=app.state.vocab[key].map(v=>v===from?to:v);app.state.vocab[key]=[...new Set(list)]}let per=app.state.vocab?.characterByWork;if(per){if(key==='character'){for(const w of Object.keys(per))per[w]=[...new Set(per[w].map(v=>v===from?to:v))]}else if(key==='work'&&per[from]){per[to]=[...new Set([...(per[to]||[]),...per[from]])];delete per[from]}}await persist();render();toast(`${count}件の名称を統一したよ`)}

// Xに貼るものは募集文ではなくハッシュタグだけ。スペース・句読点・絵文字はタグに含めない。
function hashtagify(value){
 let clean=String(value||'').normalize('NFKC').replace(/[^\p{L}\p{M}\p{N}_]/gu,'');
 if(!clean||/^\p{N}+$/u.test(clean))return '';
 return '#'+clean;
}
function tagCandidates(){
 const t=selectedTrades();const sources=[...t.wants,...t.offers];
 const buckets=[['series','商品シリーズ名','series'],['character','キャラクター名','character'],['item','商品名','title']];
 const seen=new Set(),out=[];
 for(const [kind,heading,field] of buckets)for(const source of sources){
  const original=String(source[field]||'').trim(),tag=hashtagify(original),key=tag.toLocaleLowerCase('ja-JP');
  if(!tag||seen.has(key))continue;
  seen.add(key);out.push({kind,heading,tag,original});
 }
 return out;
}
function selectedTagText(){return tagCandidates().filter(t=>!app.tagExcluded.has(t.tag)).map(t=>t.tag).join(' ')}
// 投稿全体の上限280を安全側で概算。日本語・絵文字は2、ASCIIは1として数える。
// Twitter-textのすべての例外（URLや複雑な絵文字）は網羅しないため、X投稿画面でも確認してね。
// Xの標準280ウェイト上限（日本語なら約140文字）。日本語・絵文字2、英数字1を目安に扱う。
// URL・特殊な絵文字は別計算になるので、コピー後はX側のカウンターでも確認してね。
function xWeight(str){let count=0;for(const c of String(str||'').normalize('NFC')){const cp=c.codePointAt(0);count+=(cp<=0x10FF||(cp>=0x2000&&cp<=0x200D)||(cp>=0x2010&&cp<=0x201F)||(cp>=0x2032&&cp<=0x2037))?1:2}return count}
function tagBatches(text,reserve=180){
 const tokens=[...new Set(String(text||'').trim().split(/\s+/).filter(Boolean))];
 const candidates=tagCandidates();
 const tagsByKind={series:new Set(candidates.filter(t=>t.kind==='series').map(t=>t.tag)),character:new Set(candidates.filter(t=>t.kind==='character').map(t=>t.tag))};
 const series=tokens.filter(t=>tagsByKind.series.has(t));
 const character=tokens.filter(t=>!tagsByKind.series.has(t)&&tagsByKind.character.has(t));
 const item=tokens.filter(t=>!tagsByKind.series.has(t)&&!tagsByKind.character.has(t));
 // 原文用はユーザーの本文スペースを確保。返信は最大280ウェイト＝日本語なら140文字。
 let mainMax=Math.max(10,280-Math.max(0,Math.min(270,Number(reserve)||0)));
 // 重要なシリーズ名は元ポストへ。予約していた本文の余白を超えるときは注意を表示。
 if(series.length&&xWeight(series[0])<=280)mainMax=Math.max(mainMax,xWeight(series[0]));
 const maxReply=280;
 const batches=[],overflow=[];
 let main='';
 for(const tag of series){const next=main?main+' '+tag:tag;if(xWeight(next)<=mainMax)main=next;else overflow.push(tag)}
 batches.push({text:main,used:xWeight(main),max:mainMax});
 let reply='';
 function commit(){if(reply){batches.push({text:reply,used:xWeight(reply),max:maxReply});reply=''}}
 // なるべく「シリーズ→キャラ名→商品名」ごとに並べ、タグの途中では絶対に切らない。
 for(const group of [overflow,character,item]){
  if(!group.length)continue;
  let isNewGroup=true;
  for(const tag of group){
   if(xWeight(tag)>maxReply){commit();batches.push({text:tag,used:xWeight(tag),max:maxReply,tooLong:true});isNewGroup=false;continue}
   const gap=reply?(isNewGroup?'\n':' '):'';
   const next=reply+gap+tag;
   if(xWeight(next)>maxReply){commit();reply=tag}else reply=next;
   isNewGroup=false;
  }
 }
 commit();
 return batches;
}
function tagBatchHtml(value){const reserve=app.tagReserved,batches=tagBatches(value,reserve);
 return `<div class="tag-batch-title">✦ X用に文字数を分ける</div>${batches[0]?.max>280-Math.max(0,Math.min(270,Number(reserve)||0))?'<div class="note">商品シリーズ名を元ポストに優先したよ。本文を短くするか、確保文字数を調整してね。</div>':''}<p class="help">日本語なら<strong>140文字</strong>、英数字は半分の重さとして計算。上限を超える前にハッシュタグの切れ目で<strong>リプ1・リプ2…</strong>へ分割。キャラ名と商品名はできるだけまとまりごとに整理するよ。</p><label class="label" for="tag-reserve">元ポストの募集本文のために空けておく文字数</label><input class="field" type="number" min="0" max="260" step="10" id="tag-reserve" value="${reserve}" inputmode="numeric"><p class="help">X換算値で指定：日本語90文字の本文なら180。本文用に指定した分を引いて、残りを商品シリーズ名のタグに使うよ。</p><div id="tag-batches-list">${batches.map((b,i)=>`<div class="tag-batch"><div class="row" style="justify-content:space-between;gap:8px"><b>${i===0?'元ポスト用':'リプ'+i+'用'}</b><small class="muted">日本語換算 約${Math.ceil(b.used/2)} / ${Math.ceil(b.max/2)}字</small></div>${b.text?`<div class="tag-batch-text">${esc(b.text).replace(/\n/g,'<br>')}</div>`:'<small class="muted">本文用の空きが多いため、シリーズ名タグが入りきらないよ。</small>'}<button type="button" class="soft wide" data-tag-chunk="${i}" ${!b.text||b.tooLong?'disabled':''}>📋 ${i===0?'元ポスト用':'リプ'+i+'用'}をコピー</button>${b.tooLong?'<p class="help" style="color:#b32964">このタグ単体で140字相当を超えるよ。短く編集してね。</p>':''}</div>`).join('')}</div><p class="help">※Xは日本語と英数字で文字数換算が異なるよ。URLや一部の記号は別ルールのため、投稿前にX上でも確認してね。</p>`;
}

function hashtagsInner(){
 const candidates=tagCandidates();
 const groups=['series','character','item'].map(k=>{
  const group=candidates.filter(x=>x.kind===k);if(!group.length)return '';
  return `<div class="tag-group"><div class="tag-heading">${group[0].heading}</div><div class="tag-chips">${group.map(c=>`<button type="button" class="tag-chip ${app.tagExcluded.has(c.tag)?'':'on'}" aria-pressed="${app.tagExcluded.has(c.tag)?'false':'true'}" data-hashtag="${esc(c.tag)}" title="${esc(c.original)}"><span class="checkmark">${app.tagExcluded.has(c.tag)?'＋':'✓'}</span>${esc(c.tag)}</button>`).join('')}</div></div>`;
 }).join('');
 const content=app.tagManual?app.tagDraft:selectedTagText();
 return `<div class="panel-title"># Xに貼り付けるハッシュタグ</div><p class="help">募集文は自分で作成。必要なタグだけタップして選び、まとめてコピーできるよ。</p>${candidates.length?`${groups}<div class="tag-toolbar"><button type="button" class="outline mini" data-hash-all="on">全部選ぶ</button><button type="button" class="outline mini" data-hash-all="off">全部外す</button></div>`:'<p class="note">'+'上で「求」または「譲」を選ぶと候補が出るよ。'+'</p>'}<label class="label" for="hashtag-copy-text">コピーするハッシュタグ（編集も可能）</label><textarea id="hashtag-copy-text" class="field tag-textarea" placeholder="#商品シリーズ名 #キャラ名 #商品名" spellcheck="false">${esc(content)}</textarea><button type="button" class="soft wide" data-action="hashtag-copy" style="margin-top:10px">📋 ハッシュタグを全部コピー</button><div id="tag-batches">${tagBatchHtml(content)}</div><p class="tag-tip">Xで使えるよう空白や記号を除去し、同じタグは1回だけ表示。あとから追加したキャラ名なども、新しい候補として自動反映するよ。必要なタグを選んでね。</p>`;
}
function hashtagsPanel(){return `<section id="hashtag-panel" class="panel">${hashtagsInner()}</section>`}
function refreshHashtags(){
 const candidates=tagCandidates(),current=new Set(candidates.map(t=>t.tag));
 if(app.tagManual&&app.tagCandidateSnapshot){
  const additions=candidates.filter(t=>!app.tagCandidateSnapshot.has(t.tag)&&!app.tagExcluded.has(t.tag)).map(t=>t.tag);
  if(additions.length)app.tagDraft=[app.tagDraft,...additions].filter(Boolean).join(' ').trim();
 }
 app.tagCandidateSnapshot=current;
 const panel=$('#hashtag-panel');if(panel)panel.innerHTML=hashtagsInner();
}

async function loadImage(src){return new Promise((ok,bad)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=bad;im.src=src})}
async function cropImage(file,max=950){if(!file.type.startsWith('image/'))throw Error('画像を選択');const url=URL.createObjectURL(file);try{let im=await loadImage(url),scale=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),can=document.createElement('canvas');can.width=Math.max(1,Math.round(im.naturalWidth*scale));can.height=Math.max(1,Math.round(im.naturalHeight*scale));let ctx=can.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,can.width,can.height);ctx.drawImage(im,0,0,can.width,can.height);return can.toDataURL('image/jpeg',.72)}finally{URL.revokeObjectURL(url)}}
function round(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function posterRoundRect(ctx,x,y,w,h,r){round(ctx,x,y,w,h,r)}
function posterWrappedText(ctx,str,x,y,maxWidth,lines=2,lineHeight=31){
 let chars=[...String(str||'')],out=[''];for(let ch of chars){let i=out.length-1;if(ctx.measureText(out[i]+ch).width>maxWidth&&out[i]&&out.length<lines)out.push(ch);else if(ctx.measureText(out[i]+ch).width>maxWidth&&out.length===lines)break;else out[i]+=ch}
 out.forEach((line,j)=>ctx.fillText(line,x,y+j*lineHeight,maxWidth));
}
async function createTradePoster(items,side){
 const offer=side==='offer',color=offer?'#976bc5':'#d95098',label=offer?'譲':'求',cols=items.length<=2?2:3,gap=20,margin=46,cardWidth=(1080-margin*2-gap*(cols-1))/cols,rows=Math.ceil(items.length/cols),cardHeight=270,top=128;
 let c=document.createElement('canvas');c.width=1080;c.height=Math.max(500,top+rows*(cardHeight+gap)+52);let ctx=c.getContext('2d');let gradient=ctx.createLinearGradient(0,0,1080,c.height);gradient.addColorStop(0,'#fff1f9');gradient.addColorStop(1,'#eee3ff');ctx.fillStyle=gradient;ctx.fillRect(0,0,c.width,c.height);
 ctx.setLineDash([9,12]);ctx.lineWidth=4;ctx.strokeStyle='#edbedf';ctx.strokeRect(17,17,c.width-34,c.height-34);ctx.setLineDash([]);
 ctx.font='bold 68px sans-serif';ctx.fillStyle=color;ctx.fillText(offer?'✦ 譲':'♡ 求',margin,93);
 for(let i=0;i<items.length;i++){
  let it=items[i],x=margin+(i%cols)*(cardWidth+gap),y=top+Math.floor(i/cols)*(cardHeight+gap);
  ctx.fillStyle='white';ctx.strokeStyle=offer?'#cdb4ea':'#f2b7d6';ctx.lineWidth=3;posterRoundRect(ctx,x,y,cardWidth,cardHeight,17);ctx.fill();ctx.stroke();
  let imgX=x+13,imgY=y+12,imgW=cardWidth-26,imgH=185;
  ctx.fillStyle='#faeaf5';posterRoundRect(ctx,imgX,imgY,imgW,imgH,13);ctx.fill();
  if(it.photo){try{let im=await loadImage(it.photo),fit=Math.min(imgW/im.width,imgH/im.height);ctx.drawImage(im,imgX+(imgW-im.width*fit)/2,imgY+(imgH-im.height*fit)/2,im.width*fit,im.height*fit)}catch{}}
  if(offer){let count=n(it.trade);let t=`×${count}`,pw=ctx.measureText(t).width+35;ctx.font='bold 31px sans-serif';pw=ctx.measureText(t).width+32;ctx.fillStyle='#8358b0';posterRoundRect(ctx,x+cardWidth-pw-20,y+imgH-27,pw,48,24);ctx.fill();ctx.fillStyle='white';ctx.fillText(t,x+cardWidth-pw-4,y+imgH+7)}
  ctx.fillStyle='#674d71';ctx.font='bold 24px sans-serif';posterWrappedText(ctx,it.title,x+15,y+225,cardWidth-30,2,29);
 }
 return c.toDataURL('image/png');
}
async function createCombinedTradePoster(wants,offers){
 const [wantSrc,offerSrc]=await Promise.all([wants.length?createTradePoster(wants,'want'):null,offers.length?createTradePoster(offers,'offer'):null]);
 let imgs=[];for(const src of [wantSrc,offerSrc])if(src)imgs.push(await loadImage(src));
 if(!imgs.length)throw Error('求・譲のアイテムがありません');
 let c=document.createElement('canvas');c.width=1080;c.height=imgs.reduce((h,img)=>h+img.height,0);
 const ctx=c.getContext('2d');let y=0;for(const im of imgs){ctx.drawImage(im,0,y);y+=im.height}
 return c.toDataURL('image/png');
}
